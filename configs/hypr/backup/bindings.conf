# Application bindings

# Terminal
bindd = SUPER, Q, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, Q, Terminal Float, exec, pypr-client toggle kitty
bindd = SUPER ALT, Q, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" tmux new

# Snappy-switcher
#unbind = ALT, TAB, cyclenext
#unbind = SHIFT ALT, TAB, cyclenext
#bindd = ALT, TAB, Cycle to prew Window, exec, snappy-switcher next
#bindd = SHIFT ALT, TAB, Cycle to next window, exec, snappy-switcher hide

# Sidepad
bindd = SUPER, RETURN, Spawn Sidepad, exec, ~/.config/hypr/scripts/sidepad-spawn
bindd = SUPER SHIFT, RETURN, Open Sidepad, exec, ~/.config/hypr/scripts/sidepad-spawn --init
bindd = SUPER, Z, Hide Sidepad, exec, ~/.config/hypr/scripts/sidepad-spawn --hide

# Hermes-desktop
bindd = SUPER SHIFT, H, Hermes Desktop, exec, hermes desktop

#Spotube
unbind = SUPER, M
bindd = SUPER, M, Spotube, exec, spotube

# Lock-Screen
bindd = SUPER SHIFT, L, Lock Screen, exec, hyprlock

# hypr-dock
bindd = SUPER, ALT, Hypr Dock, exec, hypr-dock

bindd = SUPER, B, Browser, exec, omarchy-launch-browser
bindd = SUPER, E, File manager, exec, uwsm app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, M, Music, exec, omarchy-launch-or-focus spotify-launcher
bindd = SUPER SHIFT ALT, M, Music TUI, exec, omarchy-launch-or-focus-tui cliamp
bindd = SUPER SHIFT, N, Toggle Warp, exec, /home/bap/.local/bin/warp_toggle.sh
bindd = SUPER SHIFT, D, Docker, exec, omarchy-launch-tui lazydocker
bindd = SUPER SHIFT, G, Signal, exec, omarchy-launch-or-focus ^signal$ "uwsm-app -- signal-desktop"
bindd = SUPER SHIFT, O, Obsidian, exec, omarchy-launch-or-focus ^obsidian$ "uwsm-app -- obsidian"
bindd = SUPER SHIFT, W, Waybar Theme, exec, kitty --title waybar-theme -e /home/bap/.local/bin/wayflipper --browse-once
bindd = SUPER SHIFT, T, Themes List, exec, kitty -e /home/bap/.local/bin/theme-manager
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- 1password
bindd = SUPER, D, Toggle window floating/tiling, togglefloating,
# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, omarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Grok, exec, omarchy-launch-webapp "https://grok.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-webapp "https://app.hey.com/calendar/weeks/"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-webapp "https://app.hey.com"
bindd = SUPER SHIFT, Y, YouTube, exec, omarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, omarchy-launch-or-focus-webapp WhatsApp "https://web.whatsapp.com/"
bindd = SUPER SHIFT CTRL, G, Google Messages, exec, omarchy-launch-or-focus-webapp "Google Messages" "https://messages.google.com/web/conversations"
bindd = SUPER SHIFT, P, Google Photos, exec, omarchy-launch-or-focus-webapp "Google Photos" "https://photos.google.com/"
bindd = SUPER SHIFT, X, X, exec, omarchy-launch-webapp "https://x.com/"
bindd = SUPER SHIFT ALT, X, X Post, exec, omarchy-launch-webapp "https://x.com/compose/post"

# --- Smart Clipboard (macOS Style) ---
unbind = SUPER, C
unbind = SUPER, V
unbind = SUPER, X
bind = SUPER, C, exec, /home/bap/.local/bin/omarchy-clipboard-wrapper copy
bind = SUPER, V, exec, /home/bap/.local/bin/omarchy-clipboard-wrapper paste
bind = SUPER, X, exec, /home/bap/.local/bin/omarchy-clipboard-wrapper cut

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Gaming mode toggle keybind (added by setup script)
bind = SUPER, F12, exec, /usr/local/bin/switch-to-gaming

# Live Wallpaper Toggle for Omarchy
bindd = SUPER ALT, W, Toggle Live Wallpaper, exec, ~/.local/bin/live-wallpaper-toggle.sh



