# quickshell-dots: route the theme/wallpaper hotkeys to the bar's pickers
unbind = SUPER SHIFT CTRL, SPACE
unbind = SUPER CTRL, SPACE
bindd  = SUPER SHIFT CTRL, SPACE, Theme picker,     exec, qs -p ~/.config/quickshell/bar/shell.qml ipc call picker theme
bindd  = SUPER CTRL, SPACE,       Wallpaper picker, exec, qs -p ~/.config/quickshell/bar/shell.qml ipc call picker wallpaper

# hyprland-scroll-overview
unbind = SUPER, TAB
#bindd = SUPER, TAB, Scroll Overview, scrolloverview:overview, toggle

# pyrpm-gloview
bind = SUPER, TAB, gloview:toggle
#unbind = SUPER SHIFT, TAB
bind = SUPER SHIFT, TAB, gloview:desktop
bind = SUPER CTRL, TAB, gloview:allworkspaces

bind = SUPER, bracketright, gloview:next
bind = SUPER, bracketleft, gloview:prev
unbind = SUPER, 1
unbind = SUPER, 2
unbind = SUPER, 3
unbind = SUPER, 4
unbind = SUPER, 5
bind = SUPER, 1, gloview:setworkspace, 1
bind = SUPER, 2, gloview:setworkspace, 2
bind = SUPER, 3, gloview:setworkspace, 3
bind = SUPER, 4, gloview:setworkspace, 4
bind = SUPER, 5, gloview:setworkspace, 5
