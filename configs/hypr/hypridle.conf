general {
    lock_cmd = ~/.config/quickshell/command-center/nerv-lock.sh
    before_sleep_cmd = OMARCHY_LOCK_ONLY=true ~/.config/quickshell/command-center/nerv-lock.sh
    after_sleep_cmd = sleep 1 && omarchy-system-wake                 # delay for PAM readiness, then turn on display.
    inhibit_sleep = 3                                      # wait until screen is locked
}

# Start screensaver after 2.5 minutes
listener {
    timeout = 150
    on-timeout = pidof hyprlock || ~/.config/quickshell/command-center/nerv-screensaver.sh
}

# Lock system after 5 minutes (screensaver resets idle timer, so have to just do half + 2s margin)
listener {
    timeout = 152
    on-timeout = ~/.config/quickshell/command-center/nerv-lock.sh
    on-resume = omarchy-system-wake
}
