source = ~/.config/omarchy/current/theme/hyprlock.conf

general {
    hide_cursor = false
    ignore_empty_input = true
}

background {
    monitor =
    color = $color
    path = ~/.config/omarchy/current/background
    blur_size = 7
    blur_passes = 4
    noise = 0.03
    contrast = 1.1
    brightness = 0.39
    vibrancy = 0.12
}

animations {
    enabled = true
    bezier = nerv, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 2.2, nerv
    animation = inputFieldDots, 1, 2, nerv
    animation = inputFieldFade, 1, 1.8, nerv
}

