# Offset archive echo: a second independently randomized source creates the
# imperfect registration-print silhouette without reducing foreground contrast.
label {
    monitor =
    text = cmd[update:1000] python3 ~/.config/quickshell/command-center/lock-ascii.py --width 210 --height 74 --period 18 --layer 1
    color = rgba(152, 70, 149, 0.075)
    font_size = 8
    font_family = JetBrainsMono Nerd Font
    position = 82, -20
    halign = left
    valign = center
}
