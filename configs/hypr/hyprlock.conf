input-field {
    monitor =
    size = 31%, 96
    position = -66, 145
    halign = right
    valign = center
    inner_color = rgba(27, 32, 33, 0.92)
    outer_color = rgba(252, 115, 93, 1.0)
    outline_thickness = 3
    font_family = JetBrainsMono Nerd Font Bold
    font_color = rgba(213, 198, 224, 1.0)
    placeholder_text = <span foreground="##96909a" font_family="Evangelion" size="18000">OPERATOR CREDENTIALS</span>
    check_color = rgba(124, 179, 117, 1.0)
    fail_color = rgba(251, 52, 117, 1.0)
    fail_text = <span foreground="##fb3475" font_family="Evangelion" size="18000">ACCESS DENIED // $ATTEMPTS</span>
    rounding = 0
    shadow_passes = 0
    fade_on_empty = false
    dots_center = false
    dots_size = 0.24
    dots_spacing = 0.38
}

