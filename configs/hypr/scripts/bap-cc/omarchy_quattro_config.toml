# Omarchy-Quattro Control Center (BAP) — curated build for Omarchy.
# Pages point at guarded scripts:
#   scripts/  – maintenance scripts (drive health, images, core runner)
#   dusky-tui-src/ – Hyprland schema TUIs (input, trackpad, monitors, ...)
#   ~/dusky/...    – root-scoped TUIs kept in place (they resolve dusky_tui
#                    via parents[2], so they must NOT be moved).
# Remove the dead / rofi / mako / hypridle / hyprlock / screentime entries.

